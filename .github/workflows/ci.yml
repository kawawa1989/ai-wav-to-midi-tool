name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # 採譜エンジン（torch・モデル重み）はCIに入れない。音源もCIに置かない。
      - run: uv sync --locked --no-group engine
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
